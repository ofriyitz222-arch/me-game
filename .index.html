<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>משחק זיכרון לספרות פאי (π)</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-hover: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-dark: #0284c7;
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #f59e0b;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 15px;
    }

    .container {
      width: 100%;
      max-width: 740px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    header {
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    header h1 {
      font-size: 1.9rem;
      color: var(--accent);
      letter-spacing: 0.5px;
    }

    header p {
      color: var(--muted);
      font-size: 0.95rem;
    }

    /* Auth Card aligned to the right of the screen */
    .auth-wrapper {
      width: 100%;
      display: flex;
      justify-content: flex-start; /* In RTL, flex-start is the RIGHT side of the screen */
    }

    .auth-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      max-width: 360px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    .auth-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .auth-tab {
      background: var(--bg);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 8px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.95rem;
    }

    .auth-tab.active {
      background: var(--accent-dark);
      color: #fff;
      border-color: var(--accent);
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .input-group label {
      font-size: 0.88rem;
      color: var(--muted);
    }

    .input-group input {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 0.98rem;
    }

    .input-group input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .remember-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.88rem;
      color: var(--text);
      cursor: pointer;
      user-select: none;
    }

    .remember-row input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .primary-btn {
      background: var(--accent-dark);
      color: #fff;
      border: 1px solid var(--accent);
      padding: 10px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s;
    }

    .primary-btn:hover {
      background: var(--accent);
      color: #0f172a;
    }

    .auth-msg {
      font-size: 0.85rem;
      text-align: center;
      min-height: 18px;
    }

    .auth-error {
      color: var(--danger);
    }

    .auth-success {
      color: var(--success);
    }

    /* User Top Bar */
    .user-bar {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
    }

    .user-bar span strong {
      color: var(--accent);
    }

    .logout-btn {
      background: transparent;
      color: var(--danger);
      border: 1px solid var(--danger);
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .logout-btn:hover {
      background: rgba(239, 68, 68, 0.15);
    }

    /* Mode Selector */
    .modes {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .mode-btn {
      background: var(--card);
      color: var(--text);
      border: 2px solid var(--border);
      padding: 10px 6px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.15s ease;
    }

    .mode-btn:hover {
      background: var(--card-hover);
    }

    .mode-btn.active {
      background: var(--accent-dark);
      border-color: var(--accent);
      color: #fff;
    }

    /* Stats Bar */
    .stats-bar {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 70px;
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--muted);
    }

    .stat-value {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text);
    }

    /* Timer Bar */
    .timer-container {
      width: 100%;
      height: 10px;
      background: var(--card);
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid var(--border);
      display: none;
    }

    .timer-fill {
      height: 100%;
      width: 100%;
      background: var(--success);
      transition: width 0.05s linear, background-color 0.2s ease;
    }

    /* Pi Display */
    .pi-box {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      min-height: 110px;
      display: flex;
      align-items: center;
      overflow-x: auto;
      direction: ltr;
      position: relative;
      transition: border-color 0.2s;
    }

    .pi-box.shake {
      animation: shake 0.3s ease-in-out;
      border-color: var(--danger);
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    .pi-stream {
      font-family: 'Courier New', Courier, monospace;
      font-size: 2rem;
      font-weight: 700;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 2px;
      letter-spacing: 2px;
    }

    .pi-prefix {
      color: var(--accent);
      margin-right: 4px;
    }

    .digit-correct {
      color: var(--success);
    }

    .digit-guide {
      color: #475569;
    }

    .digit-guide.next-target {
      color: #94a3b8;
      text-decoration: underline;
      text-decoration-color: var(--accent);
    }

    .digit-group-space {
      width: 12px;
      display: inline-block;
    }

    .cursor {
      display: inline-block;
      width: 3px;
      height: 2rem;
      background: var(--accent);
      animation: blink 1s infinite;
      margin-left: 2px;
    }

    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }

    /* Status Message */
    .message-bar {
      text-align: center;
      font-size: 0.95rem;
      min-height: 24px;
      color: var(--warning);
      font-weight: 600;
    }

    /* Controls */
    .action-controls {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .action-btn {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      transition: background 0.15s;
    }

    .action-btn:hover:not(:disabled) {
      background: var(--card-hover);
    }

    .action-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    /* Numpad */
    .numpad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      max-width: 340px;
      width: 100%;
      margin: 0 auto;
    }

    .num-btn {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 0;
      font-size: 1.5rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.08s, background 0.15s, border-color 0.15s;
      user-select: none;
    }

    .num-btn:hover {
      background: var(--card-hover);
    }

    .num-btn:active {
      transform: scale(0.95);
    }

    .num-btn.hint-highlight {
      border-color: var(--warning);
      box-shadow: 0 0 12px rgba(245, 158, 11, 0.5);
      background: rgba(245, 158, 11, 0.15);
    }

    .num-btn.zero-btn {
      grid-column: 2;
    }

    /* Leaderboard Section */
    .leaderboard-section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .leaderboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .leaderboard-header h3 {
      font-size: 1.05rem;
      color: var(--warning);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: right;
      font-size: 0.9rem;
    }

    th, td {
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
    }

    th {
      color: var(--muted);
      font-weight: 600;
    }

    tr.current-user-row {
      background: rgba(56, 189, 248, 0.12);
      font-weight: 700;
    }

    /* Notes Section */
    .notes-section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .notes-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .notes-header h3 {
      font-size: 1rem;
      color: var(--accent);
    }

    .notes-status {
      font-size: 0.8rem;
      color: var(--success);
    }

    textarea {
      width: 100%;
      min-height: 90px;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      font-size: 0.95rem;
      resize: vertical;
      line-height: 1.5;
    }

    textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    /* Study Reference Table */
    .study-table {
      display: none;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      max-height: 240px;
      overflow-y: auto;
      direction: ltr;
